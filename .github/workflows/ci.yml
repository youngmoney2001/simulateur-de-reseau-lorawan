name: CI

on:
  push:
  pull_request:

permissions:
  # L'écriture sur la branche sert uniquement à y déposer les captures d'écran : leur
  # téléchargement passe par un hôte inaccessible depuis un poste de développement.
  contents: write
  pull-requests: write

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLSIM_WARNINGS_AS_ERRORS=ON
      - name: Compiler
        run: cmake --build build --parallel
      - name: Tests C++
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurer (ASan + UBSan)
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Compiler
        run: cmake --build build-asan --parallel
      - name: Tests C++ sous sanitizers (inclut le fuzzing du codec)
        run: ./build-asan/lsim_tests

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler le cœur natif
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Dépendances
        # Le paquet ne déclare aucune dépendance d'exécution : pydantic et cryptography
        # viennent des extras. L'extra « test » regroupe tout, comme pour le job python.
        run: |
          python -m pip install "./python[test]"
          cd web && npm ci
          # Les ressources Cesium (Workers, Assets, Widgets) sont copiées dans public/cesium
          # par ce script. Rien d'autre ne le déclenche : les essais lancent Vite directement,
          # sans passer par `npm run dev`. Sans ces fichiers, Cesium reçoit l'index du serveur
          # de développement à la place de ses ressources, et son initialisation échoue.
          npm run prepare-cesium
      - name: Modules purs du studio (sans navigateur)
        run: cd web && node --test tests/*.test.mjs
      # Le studio n'était jusqu'ici jamais exécuté dans un navigateur par la CI : les défauts
      # d'interface n'étaient donc détectés par aucune vérification automatique.
      - name: Chromium
        run: cd web && npx puppeteer browsers install chrome
      - name: Studio dans un vrai navigateur
        id: e2e
        run: |
          cd web
          CHROME=$(find "$HOME/.cache/puppeteer" -type f -name chrome -perm -u+x | head -1)
          if [ -z "$CHROME" ]; then echo "Chromium introuvable"; exit 1; fi
          echo "Chromium : $CHROME"
          set -o pipefail
          CHROME_PATH="$CHROME" node tests/e2e/studio.e2e.mjs 2>&1 | tee ../e2e.log

      # L'image ne peut pas être examinée par une machine : on lui substitue des mesures.
      # Le navigateur connaît la position et la taille réelles de chaque boîte, et répond donc
      # en nombres aux questions qu'on se poserait à l'œil.
      - name: Auditer la mise en page
        id: audit
        continue-on-error: true
        run: |
          cd web
          CHROME=$(find "$HOME/.cache/puppeteer" -type f -name chrome -perm -u+x | head -1)
          set -o pipefail
          CHROME_PATH="$CHROME" node tests/e2e/audit.mjs 2>&1 | tee ../audit.log
      - name: Publier l'audit de mise en page
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let texte = '';
            try { texte = fs.readFileSync('audit.log', 'utf8'); } catch (e) { texte = '(rapport introuvable)'; }
            // Quand le studio a échoué dans le navigateur, son journal est la seule trace
            // lisible : les journaux du runner sont hébergés hors de portée du réseau. On
            // l'ajoute donc au rapport plutôt que de publier un audit vide de sens.
            if ('${{ steps.e2e.outcome }}' === 'failure') {
              let e2e = '';
              try { e2e = fs.readFileSync('e2e.log', 'utf8'); } catch (e) { e2e = '(journal e2e introuvable)'; }
              texte += '\n\n--- Journal du studio dans le navigateur (échec) ---\n\n' + e2e.slice(-20000);
            }
            const corps = ['### Audit de mise en page du studio', '',
              'Job : `${{ github.run_id }}`', '', '```', texte.slice(-60000), '```'].join('\n');
            // Sur un événement `pull_request`, `context.ref` vaut `refs/pull/N/merge` :
            // chercher la PR par cette branche ne trouve rien, et le commentaire partait
            // dans le vide. Le numéro est alors directement dans la charge utile.
            const numeros = [];
            if (context.payload.pull_request?.number) numeros.push(context.payload.pull_request.number);
            else {
              const branche = context.ref.replace('refs/heads/', '');
              const prs = await github.rest.pulls.list({ owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', head: `${context.repo.owner}:${branche}` });
              for (const pr of prs.data) numeros.push(pr.number);
            }
            for (const n of numeros) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: n, body: corps });
            }

      # Le rendu n'est observable d'aucune autre manière depuis un poste sans affichage :
      # le navigateur de la CI est le seul endroit où l'interface est réellement peinte.
      - name: Capturer le rendu du studio
        id: capture
        continue-on-error: true
        run: |
          cd web
          CHROME=$(find "$HOME/.cache/puppeteer" -type f -name chrome -perm -u+x | head -1)
          set -o pipefail
          # Les captures sont rapatriées dans la branche. Sans ce nettoyage, celles des runs
          # précédents s'accumulent et l'historique s'alourdit d'images périmées.
          rm -rf ../captures
          CHROME_PATH="$CHROME" node tests/e2e/capture.mjs 2>&1 | tee ../capture.log
      - name: Déposer les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-studio
          path: captures/
          if-no-files-found: ignore

      # Les artefacts sont servis par un hôte inaccessible depuis un poste de développement :
      # seule la branche permet de rapatrier les images. Le marqueur [skip ci] empêche ce
      # commit de déclencher à son tour une exécution, ce qui bouclerait indéfiniment.
      - name: Rapatrier les captures dans la branche
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(ls -A captures 2>/dev/null)" ]; then echo "aucune capture à rapatrier"; exit 0; fi
          git config user.name "ci-captures"
          git config user.email "ci-captures@users.noreply.github.com"
          git add -f captures
          git commit -q -m "Captures du rendu du studio [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"

      # Le journal du runner est hébergé hors de portée de l'outillage : on le publie sur la
      # pull request pour qu'il reste lisible après l'exécution.
      - name: Publier le journal du navigateur en cas d'échec
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let texte = '';
            try { texte = fs.readFileSync('e2e.log', 'utf8'); } catch (e) { texte = '(journal introuvable)'; }
            const corps = ['### Échec du studio dans le navigateur', '',
              'Job : `${{ github.run_id }}`', '', '```', texte.slice(-60000), '```'].join('\n');
            const numeros = [];
            if (context.payload.pull_request?.number) numeros.push(context.payload.pull_request.number);
            else {
              const branche = context.ref.replace('refs/heads/', '');
              const prs = await github.rest.pulls.list({ owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', head: `${context.repo.owner}:${branche}` });
              for (const pr of prs.data) numeros.push(pr.number);
            }
            for (const n of numeros) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: n, body: corps });
            }

  python:
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler le cœur natif
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Installer les dépendances de test
        # Extra « test » de python/pyproject.toml : inclut cryptography (chiffrement au repos des sessions).
        run: python -m pip install "./python[test]"
      - name: Tests Python
        run: PYTHONPATH=python pytest -q python/tests
