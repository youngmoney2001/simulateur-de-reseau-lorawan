name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLSIM_WARNINGS_AS_ERRORS=ON
      - name: Compiler
        run: cmake --build build --parallel
      - name: Tests C++
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurer (ASan + UBSan)
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Compiler
        run: cmake --build build-asan --parallel
      - name: Tests C++ sous sanitizers (inclut le fuzzing du codec)
        run: ./build-asan/lsim_tests

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler le cœur natif
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Dépendances
        # Le paquet ne déclare aucune dépendance d'exécution : pydantic et cryptography
        # viennent des extras. L'extra « test » regroupe tout, comme pour le job python.
        run: |
          python -m pip install "./python[test]"
          cd web && npm ci
      - name: Modules purs du studio (sans navigateur)
        run: cd web && node --test tests/*.test.mjs
      # Le studio n'était jusqu'ici jamais exécuté dans un navigateur par la CI : les défauts
      # d'interface n'étaient donc détectés par aucune vérification automatique.
      - name: Chromium
        run: cd web && npx puppeteer browsers install chrome
      - name: Studio dans un vrai navigateur
        id: e2e
        run: |
          cd web
          CHROME=$(find "$HOME/.cache/puppeteer" -type f -name chrome -perm -u+x | head -1)
          if [ -z "$CHROME" ]; then echo "Chromium introuvable"; exit 1; fi
          echo "Chromium : $CHROME"
          set -o pipefail
          CHROME_PATH="$CHROME" node tests/e2e/studio.e2e.mjs 2>&1 | tee ../e2e.log

      # Le rendu n'est observable d'aucune autre manière depuis un poste sans affichage :
      # le navigateur de la CI est le seul endroit où l'interface est réellement peinte.
      - name: Capturer le rendu du studio
        id: capture
        continue-on-error: true
        run: |
          cd web
          CHROME=$(find "$HOME/.cache/puppeteer" -type f -name chrome -perm -u+x | head -1)
          set -o pipefail
          CHROME_PATH="$CHROME" node tests/e2e/capture.mjs 2>&1 | tee ../capture.log
      - name: Déposer les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-studio
          path: captures/
          if-no-files-found: ignore

      # Le journal du runner est hébergé hors de portée de l'outillage : on le publie sur la
      # pull request pour qu'il reste lisible après l'exécution.
      - name: Publier le journal du navigateur en cas d'échec
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let texte = '';
            try { texte = fs.readFileSync('e2e.log', 'utf8'); } catch (e) { texte = '(journal introuvable)'; }
            const corps = ['### Échec du studio dans le navigateur', '',
              'Job : `${{ github.run_id }}`', '', '```', texte.slice(-60000), '```'].join('\n');
            const prs = await github.rest.pulls.list({ owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}` });
            for (const pr of prs.data) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, body: corps });
            }

  python:
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler le cœur natif
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Installer les dépendances de test
        # Extra « test » de python/pyproject.toml : inclut cryptography (chiffrement au repos des sessions).
        run: python -m pip install "./python[test]"
      - name: Tests Python
        run: PYTHONPATH=python pytest -q python/tests
