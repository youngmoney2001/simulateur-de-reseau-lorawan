name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLSIM_WARNINGS_AS_ERRORS=ON
      - name: Compiler
        run: cmake --build build --parallel
      - name: Tests C++
        run: ctest --test-dir build --output-on-failure

  python:
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler le cœur natif
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Installer les dépendances de test
        run: python -m pip install "pytest>=8"
      - name: Tests Python
        run: PYTHONPATH=python pytest -q python/tests
