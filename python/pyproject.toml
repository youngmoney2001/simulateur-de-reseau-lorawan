[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsim"
version = "0.1.0"
description = "Simulateur LoRaWAN : cœur natif C++ et API Python"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["pydantic>=2", "pyyaml>=6", "pyarrow>=14"]
report = ["openpyxl>=3.1", "reportlab>=4"]
test = ["pytest>=8", "pydantic>=2", "pyyaml>=6", "pyarrow>=14", "openpyxl>=3.1", "reportlab>=4"]

[tool.setuptools]
package-dir = { "" = "." }
packages = ["lsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
